<div class="p-8 max-w-2xl">
  <div class="mb-6">
    <a routerLink="/app/foi" class="text-sm text-blue-600 hover:underline"
      >← Back to FOI Requests</a
    >
    <h2 class="text-2xl font-bold text-gray-900 mt-2">Submit FOI Request</h2>
    <p class="text-sm text-gray-500 mt-1">
      Under Republic Act 11032 and Local FOI Policy. Response time: 15 working days.
    </p>
  </div>

  @if (error()) {
    <div class="mb-5 p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
      {{ error() }}
    </div>
  }

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 space-y-5"
  >
    <div>
      <h3 class="text-sm font-semibold text-gray-700 mb-4 pb-2 border-b border-gray-100">
        Requester Information
      </h3>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Full Name <span class="text-red-500">*</span></label
            >
            <input
              formControlName="name"
              type="text"
              class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              [class.border-red-400]="form.get('name')?.invalid && form.get('name')?.touched"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Email <span class="text-red-500">*</span></label
            >
            <input
              formControlName="email"
              type="email"
              class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched"
            />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
            <input
              formControlName="phone"
              type="tel"
              class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Organization</label>
            <input
              formControlName="organization"
              type="text"
              class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Requester Type</label>
          <select
            formControlName="requesterType"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            @for (t of requesterTypes; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div>
      <h3 class="text-sm font-semibold text-gray-700 mb-4 pb-2 border-b border-gray-100">
        Request Details
      </h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Purpose / Reason <span class="text-red-500">*</span></label
          >
          <textarea
            formControlName="purpose"
            rows="3"
            placeholder="Explain the purpose of your request..."
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
            [class.border-red-400]="form.get('purpose')?.invalid && form.get('purpose')?.touched"
          ></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Document Search Query</label>
          <input
            formControlName="searchQuery"
            type="text"
            placeholder="e.g. ordinances about zoning 2023"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <p class="text-xs text-gray-400 mt-1">
            Describe the documents you are requesting, or enter specific document IDs.
          </p>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
      <a
        routerLink="/app/foi"
        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors"
      >
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="submitting()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 transition-colors"
      >
        {{ submitting() ? 'Submitting…' : 'Submit FOI Request' }}
      </button>
    </div>
  </form>
</div>
