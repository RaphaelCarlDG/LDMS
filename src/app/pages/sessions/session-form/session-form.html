<div class="p-8 max-w-2xl">
  <div class="mb-6">
    <a routerLink="/app/sessions" class="text-sm text-blue-600 hover:underline"
      >← Back to Sessions</a
    >
    <h2 class="text-2xl font-bold text-gray-900 mt-2">New Session</h2>
  </div>

  @if (error()) {
    <div class="mb-5 p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
      {{ error() }}
    </div>
  }

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 space-y-5"
  >
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Session Title <span class="text-red-500">*</span></label
      >
      <input
        formControlName="title"
        type="text"
        placeholder="e.g. 12th Regular Session of the Sanggunian"
        class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Session Type</label>
        <select
          formControlName="type"
          class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          @for (t of sessionTypes; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Committee (optional)</label>
        <select
          formControlName="committeeId"
          class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Plenary / Full Council</option>
          @for (c of committees(); track c.committeeId) {
            <option [value]="c.committeeId">{{ c.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Date & Time <span class="text-red-500">*</span></label
        >
        <input
          formControlName="scheduledAt"
          type="datetime-local"
          class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Venue Type</label>
        <select
          formControlName="venueType"
          class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="in_person">In Person</option>
          <option value="virtual">Virtual</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </div>
    </div>

    @if (form.get('venueType')?.value !== 'in_person') {
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Meeting URL</label>
        <input
          formControlName="meetingUrl"
          type="url"
          placeholder="https://meet.example.com/..."
          class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    }

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
      <a
        routerLink="/app/sessions"
        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors"
      >
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="submitting()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 transition-colors"
      >
        {{ submitting() ? 'Scheduling…' : 'Schedule Session' }}
      </button>
    </div>
  </form>
</div>
